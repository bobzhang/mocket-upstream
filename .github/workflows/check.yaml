name: MoonBit
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        moonbit: [latest, pre-release]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --deny-warn --target js,native
      - run: moon info --target native
      - run: git diff --exit-code
      - run: moon fmt --check
      - run: moon test --target js,native
